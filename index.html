<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>군생활 삭제 버튼</title>
<meta name="description" content="입대일과 전역일을 넣고, 남은 군생활을 마음껏 눌러 삭제하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">

<!--
  ─────────────────────────────────────────────────────────────
  광고(AdSense H5 Games Ads) 활성화 방법
  ─────────────────────────────────────────────────────────────
  1) AdSense 승인 + "H5 Games Ads" 활성화 (기본은 꺼져 있음)
  2) 아래 script 주석을 풀고 ca-pub-XXXXXXXXXXXXXXXX 를 실제 게시자 ID로 교체
  3) 도메인 루트에 ads.txt 배치, HTTPS로 배포 (file:// 에서는 동작하지 않음)
  주석 상태에서는 자동으로 개발용 광고 플레이스홀더가 대신 뜹니다.

  <script async
    data-ad-frequency-hint="30s"
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
    crossorigin="anonymous"></script>
-->

<style>
  :root{
    --ground:#f4f5f2;
    --surface:#ffffff;
    --ink:#14181a;
    --ink-2:#414a4c;
    --muted:#78827f;
    --line:#dfe2dc;
    --line-soft:#ecefe9;
    --accent:#4a5d23;
    --accent-soft:#e8eddc;
    --danger:#b3402f;
    --danger-hi:#c74b38;
    --danger-ink:#ffffff;

    /* 비상정지 스위치 — 돔 캡과 금속 플레이트 */
    --cap-hi:#ff7a63;
    --cap:#dc3a26;
    --cap-deep:#a01d12;
    --cap-wall:#7a1409;
    --cap-ink:#fff3f0;
    --plate:#cdd0c8;
    --plate-2:#aeb2a8;
    --plate-edge:#8e938a;
    --screw:#868b80;

    --shadow:0 1px 2px rgba(20,24,26,.05), 0 10px 28px -18px rgba(20,24,26,.28);
    --scrim:rgba(20,24,26,.62);

    --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --pad:clamp(1.1rem,4vw,1.75rem);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0e1210;
      --surface:#161b18;
      --ink:#e9ede8;
      --ink-2:#b4bdb6;
      --muted:#7e8880;
      --line:#262d28;
      --line-soft:#1d231f;
      --accent:#9dbb5a;
      --accent-soft:#212a17;
      --danger:#e0705c;
      --danger-hi:#ea8270;
      --danger-ink:#1a0f0c;

      --cap-hi:#ff8f78;
      --cap:#d33a26;
      --cap-deep:#8b1a0f;
      --cap-wall:#5e0f08;
      --cap-ink:#fff1ed;
      --plate:#2e342f;
      --plate-2:#232924;
      --plate-edge:#3f463f;
      --screw:#4c534c;

      --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -18px rgba(0,0,0,.8);
      --scrim:rgba(0,0,0,.72);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0e1210;
    --surface:#161b18;
    --ink:#e9ede8;
    --ink-2:#b4bdb6;
    --muted:#7e8880;
    --line:#262d28;
    --line-soft:#1d231f;
    --accent:#9dbb5a;
    --accent-soft:#212a17;
    --danger:#e0705c;
    --danger-hi:#ea8270;
    --danger-ink:#1a0f0c;

    --cap-hi:#ff8f78;
    --cap:#d33a26;
    --cap-deep:#8b1a0f;
    --cap-wall:#5e0f08;
    --cap-ink:#fff1ed;
    --plate:#2e342f;
    --plate-2:#232924;
    --plate-edge:#3f463f;
    --screw:#4c534c;

    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -18px rgba(0,0,0,.8);
    --scrim:rgba(0,0,0,.72);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

  .wrap{
    max-width:540px;
    margin:0 auto;
    padding:clamp(2rem,7vw,3.5rem) var(--pad) clamp(3rem,10vw,5rem);
  }

  /* ---------- head ---------- */
  .mark{
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    display:flex;align-items:center;gap:.65rem;
  }
  .mark::after{content:"";flex:1;height:1px;background:var(--line)}
  h1{
    font-size:clamp(1.9rem,6.5vw,2.5rem);
    line-height:1.18;
    font-weight:700;
    letter-spacing:-.03em;
    margin:.9rem 0 .5rem;
    text-wrap:balance;
  }
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 2rem}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:1.25rem 1.25rem 1.4rem;
    margin-bottom:1.1rem;
  }
  .card-label{
    font-family:var(--mono);
    font-size:.66rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:1rem;
  }

  /* 설정 스트립 — 한 번 입력하면 끝나는 항목이라 시각적 비중을 낮춘다 */
  .setup{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:.55rem .8rem;
    padding:.7rem .85rem;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:1rem;
  }
  .pair{display:flex;align-items:center;gap:.45rem}
  .pair label{
    font-family:var(--mono);
    font-size:.66rem;
    letter-spacing:.14em;
    color:var(--muted);
  }
  .arrow{color:var(--line);font-size:.85rem;user-select:none}
  /* 좁은 화면에서는 두 줄로 떨어지므로 폭을 맞춰 오른쪽 끝을 정렬한다 */
  @media (max-width:479px){
    .arrow{display:none}
    .pair{flex:1 1 100%}
    .pair input{flex:1}
  }
  input[type="date"]{
    font-family:var(--mono);
    font-size:.8rem;
    color:var(--ink);
    background:var(--ground);
    border:1px solid var(--line);
    border-radius:5px;
    padding:.32rem .42rem;
    min-width:0;
    font-variant-numeric:tabular-nums;
  }
  input[type="date"]:focus{border-color:var(--accent)}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.75)}
  }
  :root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.75)}

  .presets{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
  .preset{
    font-family:var(--mono);
    font-size:.68rem;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:99px;
    padding:.22rem .55rem;
    cursor:pointer;
    transition:border-color .15s ease,color .15s ease,background .15s ease;
  }
  .preset:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  .error{
    display:none;
    flex-basis:100%;
    margin:0;
    font-size:.78rem;
    color:var(--danger);
  }
  .error.on{display:block}

  /* ---------- result ---------- */
  #result{display:none}
  #result.on{display:block}

  .pct-row{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.6rem}
  .pct{
    font-family:var(--mono);
    font-size:clamp(2.2rem,9vw,2.9rem);
    font-weight:600;
    letter-spacing:-.03em;
    line-height:1;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .pct small{font-size:.42em;font-weight:500;margin-left:.1em}
  .dday{
    font-family:var(--mono);
    font-size:1.05rem;
    font-weight:500;
    color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }

  .bar{
    position:relative;
    height:8px;
    background:var(--line-soft);
    border:1px solid var(--line);
    border-radius:99px;
    overflow:hidden;
  }
  /* 25 / 50 / 75% 눈금 — 계기 눈금이지 장식이 아니다 */
  .bar::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(90deg,
      transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%);
  }
  .bar-fill{
    height:100%;
    width:0;
    background:var(--accent);
    border-radius:99px;
    transition:width .7s cubic-bezier(.22,1,.36,1);
  }

  .remain{
    margin:1.1rem 0 0;
    font-size:1.45rem;
    font-weight:600;
    letter-spacing:-.02em;
  }
  .remain em{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .served{
    margin:.3rem 0 0;
    font-family:var(--mono);
    font-size:.78rem;
    letter-spacing:.02em;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- 비상정지 스위치 ---------- */
  /* padding-top 은 -1일 팝업이 떠오를 자리 */
  .console{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1rem;
    margin-top:2rem;
    padding-top:2.4rem;
  }

  .plate{
    position:relative;
    width:clamp(214px,60vw,262px);
    aspect-ratio:1;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:radial-gradient(circle at 50% 32%, var(--plate) 0%, var(--plate-2) 78%);
    border:1px solid var(--plate-edge);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -2px 6px rgba(0,0,0,.18),
      0 14px 30px -18px rgba(0,0,0,.55);
  }
  /* 캡이 앉는 안쪽 홈 */
  .plate::before{
    content:"";
    position:absolute;
    inset:13%;
    border-radius:50%;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.26);
  }
  .screw{
    position:absolute;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--screw);
    box-shadow:inset 0 1px 1px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.25);
  }
  .screw.n{top:6%;left:50%;transform:translateX(-50%)}
  .screw.s{bottom:6%;left:50%;transform:translateX(-50%)}
  .screw.w{left:6%;top:50%;transform:translateY(-50%)}
  .screw.e{right:6%;top:50%;transform:translateY(-50%)}

  #deleteBtn{
    position:relative;
    z-index:1;
    width:62%;
    aspect-ratio:1;
    padding:0;
    border:0;
    border-radius:50%;
    cursor:pointer;
    font-family:var(--sans);
    font-size:clamp(1.1rem,4.2vw,1.35rem);
    font-weight:700;
    letter-spacing:.03em;
    color:var(--cap-ink);
    background:radial-gradient(circle at 38% 27%, var(--cap-hi) 0%, var(--cap) 46%, var(--cap-deep) 100%);
    text-shadow:0 1px 2px rgba(0,0,0,.42);
    /* 벽이 아래로만 뻗으므로, 그만큼 아래 마진을 줘야 원 안에서 광학적으로 중앙에 온다.
       transform 이 아니라 마진으로 잡아야 눌림 애니메이션과 값이 얽히지 않는다. */
    margin-bottom:7px;
    box-shadow:
      0 7px 0 var(--cap-wall),
      0 13px 20px -8px rgba(0,0,0,.5),
      inset 0 -6px 12px rgba(0,0,0,.3),
      inset 0 4px 10px rgba(255,255,255,.22);
    transition:transform .07s ease, box-shadow .07s ease;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }
  #deleteBtn:active,
  #deleteBtn.punch{
    transform:translateY(7px);
    box-shadow:
      0 2px 0 var(--cap-wall),
      0 5px 10px -6px rgba(0,0,0,.5),
      inset 0 -3px 8px rgba(0,0,0,.34),
      inset 0 3px 8px rgba(255,255,255,.16);
  }

  .ripple{
    position:absolute;
    left:50%;top:50%;
    width:100%;
    aspect-ratio:1;
    border-radius:50%;
    border:1px solid var(--cap);
    transform:translate(-50%,-50%) scale(1);
    opacity:.45;
    pointer-events:none;
    animation:ring .55s ease-out forwards;
  }
  @keyframes ring{
    to{transform:translate(-50%,-50%) scale(1.32);opacity:0}
  }

  /* 누르라고 만든 버튼에 붙는 경고 */
  .warn{
    margin:0;
    font-family:var(--mono);
    font-size:.7rem;
    letter-spacing:.34em;
    text-indent:.34em;
    color:var(--muted);
  }

  .pop{
    position:absolute;
    pointer-events:none;
    font-family:var(--mono);
    font-size:.85rem;
    font-weight:600;
    color:var(--accent);
    animation:rise .75s ease-out forwards;
    will-change:transform,opacity;
  }
  @keyframes rise{
    from{opacity:1;transform:translate(-50%,0) scale(1)}
    to{opacity:0;transform:translate(-50%,-58px) scale(1.25)}
  }

  .foot-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    margin-top:1rem;
    flex-wrap:wrap;
  }
  .count{
    font-family:var(--mono);
    font-size:.82rem;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .count b{color:var(--ink);font-weight:600}
  .icon-btn{
    font-family:var(--mono);
    font-size:.74rem;
    letter-spacing:.06em;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:99px;
    padding:.3rem .75rem;
    cursor:pointer;
    transition:color .15s ease,border-color .15s ease;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--muted)}

  footer{
    margin-top:2.75rem;
    padding-top:1.5rem;
    border-top:1px solid var(--line-soft);
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.04em;
    color:var(--muted);
    line-height:1.9;
  }

  /* ---------- ad modal (dev placeholder) ---------- */
  .scrim{
    position:fixed;inset:0;
    background:var(--scrim);
    display:none;
    align-items:center;
    justify-content:center;
    padding:1.25rem;
    z-index:50;
  }
  .scrim.on{display:flex}
  .adbox{
    width:100%;
    max-width:360px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:1.5rem;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .adbox .tag{
    font-family:var(--mono);
    font-size:.64rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .adslot{
    margin:1rem 0 1.25rem;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px dashed var(--line);
    border-radius:8px;
    color:var(--muted);
    font-family:var(--mono);
    font-size:.8rem;
    background:var(--ground);
  }
  .adbox button{
    width:100%;
    font-family:var(--sans);
    font-size:.9rem;
    font-weight:600;
    color:var(--ink);
    background:var(--ground);
    border:1px solid var(--line);
    border-radius:8px;
    padding:.7rem;
    cursor:pointer;
  }
  .adbox button[disabled]{color:var(--muted);cursor:default}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="mark">Service Terminator</div>
  <h1>군생활 삭제 버튼</h1>
  <p class="sub">아무것도 실제로 삭제되지 않습니다. 그냥 누르세요.</p>

  <div class="setup">
    <div class="pair">
      <label for="startDate">입대</label>
      <input type="date" id="startDate">
    </div>
    <span class="arrow" aria-hidden="true">→</span>
    <div class="pair">
      <label for="endDate">전역</label>
      <input type="date" id="endDate">
    </div>
    <div class="presets">
      <button class="preset" type="button" data-months="18" title="입대일 기준 전역일 자동 계산 · 육군 · 해병 18개월">육군 18</button>
      <button class="preset" type="button" data-months="20" title="입대일 기준 전역일 자동 계산 · 해군 20개월">해군 20</button>
      <button class="preset" type="button" data-months="21" title="입대일 기준 전역일 자동 계산 · 공군 21개월">공군 21</button>
    </div>
    <p class="error" id="err"></p>
  </div>

  <section class="card" id="result">
    <div class="card-label">진행 상황</div>
    <div class="pct-row">
      <div class="pct"><span id="pctNum">0</span><small>%</small></div>
      <div class="dday" id="dday">D-0</div>
    </div>
    <div class="bar" role="progressbar" id="bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="복무 진행률">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <p class="remain" id="remain"></p>
    <p class="served" id="served"></p>
  </section>

  <div class="console">
    <div class="plate" id="plate">
      <span class="screw n"></span>
      <span class="screw s"></span>
      <span class="screw w"></span>
      <span class="screw e"></span>
      <button id="deleteBtn" type="button" aria-label="군생활 삭제">삭제</button>
    </div>
    <p class="warn">누르지 마시오</p>
  </div>

  <div class="foot-row">
    <div class="count"><b id="countNum">0</b>번 삭제됨</div>
    <button class="icon-btn" id="soundBtn" type="button" aria-pressed="false">🔊 소리 켬</button>
  </div>

  <footer>
    실제 복무 기간은 변하지 않습니다.<br>
    입력한 날짜와 누른 횟수는 이 브라우저에만 저장되며 어디로도 전송되지 않습니다.
  </footer>
</div>

<div class="scrim" id="adScrim" role="dialog" aria-modal="true" aria-label="광고">
  <div class="adbox">
    <div class="tag">Advertisement</div>
    <div class="adslot">광고 자리 · 개발용 플레이스홀더</div>
    <button type="button" id="adClose" disabled>닫기 (<span id="adTimer">5</span>)</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════
     설정
     ══════════════════════════════════════════ */
  var AD_INTERVAL = 50;          // 몇 번 누를 때마다 광고를 띄울지
  var COMBO_RESET_MS = 1200;     // 이 시간 이상 쉬면 콤보 초기화
  var MAX_VOICES = 8;            // 동시 발음 상한
  var LS = { start: 'ad.start', end: 'ad.end', count: 'ad.count', muted: 'ad.muted' };

  var $ = function (id) { return document.getElementById(id); };
  var startEl = $('startDate'), endEl = $('endDate'), errEl = $('err');
  var resultEl = $('result'), pctNum = $('pctNum'), ddayEl = $('dday');
  var barEl = $('bar'), barFill = $('barFill'), remainEl = $('remain'), servedEl = $('served');
  var btn = $('deleteBtn'), plate = $('plate'), countNum = $('countNum'), soundBtn = $('soundBtn');
  var stage = document.querySelector('.console');
  var adScrim = $('adScrim'), adClose = $('adClose'), adTimer = $('adTimer');

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  /* ══════════════════════════════════════════
     날짜 계산 (순수 함수)
     ══════════════════════════════════════════ */

  // 'YYYY-MM-DD' → 로컬 자정 Date. 잘못된 값이면 null.
  // Date.parse 는 이 형식을 UTC 로 해석하므로 직접 파싱한다.
  function parseISO(s) {
    if (!s) return null;
    var p = String(s).split('-');
    if (p.length !== 3) return null;
    var y = +p[0], m = +p[1], d = +p[2];
    if (!y || !m || !d) return null;
    var dt = new Date(y, m - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
    return dt;
  }

  function toISO(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }

  // 서머타임/타임존으로 어긋난 소수점을 반올림으로 흡수한다.
  function dayDiff(a, b) { return Math.round((b - a) / 86400000); }

  // 월말 보정 포함 (1/31 + 1개월 = 2/28)
  function addMonths(d, n) {
    var y = d.getFullYear(), m = d.getMonth() + n, day = d.getDate();
    var last = new Date(y, m + 1, 0).getDate();
    return new Date(y, m, Math.min(day, last));
  }

  function midnightToday() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  // 남은 기간을 달력 기준 개월 + 일로 쪼갠다. (남은일/30 은 실제 달력과 어긋난다)
  function splitMonths(from, to) {
    var months = 0;
    while (addMonths(from, months + 1) <= to) months++;
    return { months: months, days: dayDiff(addMonths(from, months), to) };
  }

  function calcService(startISO, endISO, today) {
    var s = parseISO(startISO), e = parseISO(endISO);
    if (!s || !e) return { state: 'empty' };
    if (e <= s) return { state: 'invalid' };

    var total = dayDiff(s, e);
    var served = dayDiff(s, today);

    if (served < 0) return { state: 'before', total: total, dday: -served };
    if (served >= total) return { state: 'done', total: total, served: total, progress: 1 };

    var rest = splitMonths(today, e);
    return {
      state: 'active',
      total: total,
      served: served,
      progress: served / total,
      dday: total - served,
      months: rest.months,
      days: rest.days
    };
  }

  /* ══════════════════════════════════════════
     렌더링
     ══════════════════════════════════════════ */
  function setError(msg) {
    errEl.textContent = msg || '';
    errEl.className = msg ? 'error on' : 'error';
  }

  function render() {
    var r = calcService(startEl.value, endEl.value, midnightToday());

    if (r.state === 'empty') { setError(''); resultEl.className = 'card'; return; }
    if (r.state === 'invalid') {
      setError('전역일이 입대일보다 뒤여야 합니다.');
      resultEl.className = 'card';
      return;
    }
    setError('');
    resultEl.className = 'card on';

    if (r.state === 'before') {
      pctNum.textContent = '0';
      barFill.style.width = '0%';
      barEl.setAttribute('aria-valuenow', '0');
      ddayEl.textContent = 'D-' + r.dday;
      remainEl.innerHTML = '아직 입대 전 · <em>' + r.dday + '</em>일 남음';
      servedEl.textContent = '총 복무 예정 ' + r.total + '일';
      return;
    }

    if (r.state === 'done') {
      pctNum.textContent = '100';
      barFill.style.width = '100%';
      barEl.setAttribute('aria-valuenow', '100');
      ddayEl.textContent = '전역';
      remainEl.textContent = '전역했습니다. 축하합니다.';
      servedEl.textContent = '복무 ' + r.total + ' / ' + r.total + '일';
      return;
    }

    var pct = Math.floor(r.progress * 1000) / 10;   // 소수 첫째 자리, 반올림 없이
    pctNum.textContent = pct.toFixed(1);
    barFill.style.width = (r.progress * 100) + '%';
    barEl.setAttribute('aria-valuenow', String(Math.round(r.progress * 100)));
    ddayEl.textContent = 'D-' + r.dday;

    // 딱 떨어지는 달이면 "15개월 0일" 대신 "15개월"
    var parts = [];
    if (r.months > 0) parts.push('<em>' + r.months + '</em>개월');
    if (r.days > 0 || r.months === 0) parts.push('<em>' + r.days + '</em>일');
    remainEl.innerHTML = parts.join(' ') + ' 남음';
    servedEl.textContent = '복무 ' + r.served + ' / ' + r.total + '일';
  }

  /* ══════════════════════════════════════════
     사운드 (Web Audio 합성 · 외부 파일 없음)
     ══════════════════════════════════════════ */
  var ctx = null, noiseBuf = null, voices = [], comboIdx = 0, lastClick = 0;
  var muted = load(LS.muted) === '1';

  // C 메이저 펜타토닉을 두 옥타브 반 쌓아 올린 사다리
  var SCALE = [261.63, 293.66, 329.63, 392.00, 440.00,
               523.25, 587.33, 659.25, 783.99, 880.00,
               1046.50, 1174.66, 1318.51];

  function audio() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    // 화이트노이즈는 한 번만 만들어 재사용
    var len = Math.floor(ctx.sampleRate * 0.2);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var ch = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    return ctx;
  }

  // 연타해도 노드가 쌓이지 않도록 상한을 두고 끝난 노드는 즉시 끊는다.
  function track(node) {
    voices.push(node);
    if (voices.length > MAX_VOICES) {
      var old = voices.shift();
      try { old.stop(); } catch (e) {}
    }
    node.onended = function () {
      try { node.disconnect(); } catch (e) {}
      var i = voices.indexOf(node);
      if (i > -1) voices.splice(i, 1);
    };
  }

  // 타격감: 짧은 노이즈 버스트를 밴드패스로 깎는다
  function thud(t, gain) {
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 2000; bp.Q.value = 0.9;
    var g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t + 0.05);
    track(src);
  }

  // 음정: 삼각파 + 지수 감쇠
  function tone(t, freq, gain, dur) {
    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
    track(osc);
  }

  function playClick(count) {
    if (muted) return;
    var c = audio();
    if (!c) return;
    if (c.state === 'suspended') c.resume();

    var now = c.currentTime;
    var wall = Date.now();
    if (wall - lastClick > COMBO_RESET_MS) comboIdx = 0;
    else comboIdx = Math.min(comboIdx + 1, SCALE.length - 1);
    lastClick = wall;

    thud(now, 0.22);
    tone(now, SCALE[comboIdx], 0.2, 0.18);

    // 10회 배수마다 아르페지오 보상
    if (count % 10 === 0) {
      var base = Math.min(comboIdx, SCALE.length - 5);
      tone(now + 0.02, SCALE[base + 2], 0.16, 0.3);
      tone(now + 0.04, SCALE[base + 4], 0.14, 0.36);
    }
  }

  function syncSoundBtn() {
    soundBtn.textContent = muted ? '🔇 소리 끔' : '🔊 소리 켬';
    soundBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
  }

  /* ══════════════════════════════════════════
     광고 — AdSense H5 Games Ads
     ══════════════════════════════════════════ */
  var adInFlight = false;
  var adsReady = false;

  if (typeof window.adConfig === 'function') {
    window.adConfig({
      preloadAdBreaks: 'on',
      sound: 'on',
      onReady: function () { adsReady = true; }
    });
  }

  function beforeAd() {
    if (ctx && ctx.state === 'running') ctx.suspend();
  }
  function afterAd() {
    if (ctx && ctx.state === 'suspended' && !muted) ctx.resume();
  }

  // 광고 호출은 전부 여기를 지난다. 다른 네트워크로 갈아탈 때 이 함수만 고치면 된다.
  function triggerAd() {
    if (adInFlight) return;
    adInFlight = true;

    if (typeof window.adBreak !== 'function') {
      // 로컬 개발 · 광고 차단기 · 미승인 도메인 → 플레이스홀더로 대체
      beforeAd();
      showDevAd(function () { afterAd(); adInFlight = false; });
      return;
    }

    window.adBreak({
      type: 'next',
      name: 'delete-milestone',
      beforeAd: beforeAd,
      afterAd: afterAd,
      adBreakDone: function (info) {
        // viewed / dismissed / frequencyCapped / notReady / noAdPreloaded /
        // timeout / error / ignored / other — 어느 쪽이든 앱은 계속 돌아간다.
        adInFlight = false;
        if (window.console && console.debug) {
          console.debug('[ad] breakStatus =', info && info.breakStatus);
        }
      }
    });
  }

  var devAdTimer = null;
  function showDevAd(done) {
    var left = 5;
    adTimer.textContent = left;
    adClose.disabled = true;
    adScrim.className = 'scrim on';

    clearInterval(devAdTimer);
    devAdTimer = setInterval(function () {
      left--;
      adTimer.textContent = left;
      if (left <= 0) {
        clearInterval(devAdTimer);
        adClose.disabled = false;
        adClose.textContent = '닫기';
      }
    }, 1000);

    adClose.onclick = function () {
      if (adClose.disabled) return;
      clearInterval(devAdTimer);
      adScrim.className = 'scrim';
      adClose.innerHTML = '닫기 (<span id="adTimer">5</span>)';
      adTimer = $('adTimer');
      done();
    };
  }

  /* ══════════════════════════════════════════
     클릭
     ══════════════════════════════════════════ */
  var count = parseInt(load(LS.count) || '0', 10);
  if (!isFinite(count) || count < 0) count = 0;

  var punchTimer = null;
  function punch() {
    btn.classList.add('punch');
    clearTimeout(punchTimer);
    punchTimer = setTimeout(function () { btn.classList.remove('punch'); }, 90);
  }

  // 캡에서 퍼져 나가는 링. 연타해도 항상 하나만 — 겹치면 산만하고 노드도 쌓인다.
  function ripple() {
    var old = plate.querySelector('.ripple');
    if (old) plate.removeChild(old);
    var el = document.createElement('span');
    el.className = 'ripple';
    plate.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 600);
  }

  function pop() {
    // 연타 시 상한. 화면에 8개 넘게 떠 있으면 읽히지도 않는다.
    var live = stage.querySelectorAll('.pop');
    if (live.length >= 8) stage.removeChild(live[0]);
    var el = document.createElement('span');
    el.className = 'pop';
    el.textContent = '-1일';
    el.style.left = (25 + Math.random() * 50) + '%';
    el.style.top = (0.8 + Math.random() * 0.9) + 'rem';
    stage.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 800);
  }

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  btn.addEventListener('click', function () {
    count++;
    countNum.textContent = count.toLocaleString('ko-KR');
    store(LS.count, String(count));

    playClick(count);
    punch();                              // 눌림은 장식이 아니라 버튼의 기본 피드백
    if (!reduced) { pop(); ripple(); }
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }

    if (count % AD_INTERVAL === 0) triggerAd();
  });

  soundBtn.addEventListener('click', function () {
    muted = !muted;
    store(LS.muted, muted ? '1' : '0');
    syncSoundBtn();
    if (!muted) { var c = audio(); if (c && c.state === 'suspended') c.resume(); }
  });

  /* ══════════════════════════════════════════
     입력 처리
     ══════════════════════════════════════════ */
  startEl.addEventListener('change', function () { store(LS.start, startEl.value); render(); });
  endEl.addEventListener('change', function () { store(LS.end, endEl.value); render(); });

  Array.prototype.forEach.call(document.querySelectorAll('.preset'), function (p) {
    p.addEventListener('click', function () {
      var s = parseISO(startEl.value);
      if (!s) { setError('먼저 입대일을 입력해 주세요.'); return; }
      // 만기 전역일 = 입대일 + n개월 - 1일
      var months = parseInt(p.getAttribute('data-months'), 10);
      var e = addMonths(s, months);
      e.setDate(e.getDate() - 1);
      endEl.value = toISO(e);
      store(LS.end, endEl.value);
      render();
    });
  });

  // 복원
  var sv = load(LS.start), ev = load(LS.end);
  if (sv) startEl.value = sv;
  if (ev) endEl.value = ev;
  countNum.textContent = count.toLocaleString('ko-KR');
  syncSoundBtn();
  render();

  // 콘솔 검증용
  window.__army = {
    calcService: calcService, parseISO: parseISO,
    addMonths: addMonths, splitMonths: splitMonths
  };
})();
</script>
</body>
</html>
