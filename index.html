<style>
  :root{
    --ground:#f4f5f2;
    --surface:#ffffff;
    --ink:#14181a;
    --ink-2:#414a4c;
    --muted:#78827f;
    --line:#dfe2dc;
    --line-soft:#ecefe9;
    --accent:#4a5d23;
    --accent-soft:#e8eddc;
    --danger:#b3402f;
    --danger-hi:#c74b38;
    --danger-ink:#ffffff;

    /* 비상정지 스위치 — 돔 캡과 금속 플레이트 */
    --cap-hi:#ff7a63;
    --cap:#dc3a26;
    --cap-deep:#a01d12;
    --cap-ink:#fff3f0;
    /* 원통 측면 — 위에서 아래로 어두워진다 */
    --cap-wall:#96200f;
    --cap-wall-2:#7a1409;
    --cap-wall-3:#5c0e06;
    --plate:#cdd0c8;
    --plate-2:#aeb2a8;
    --plate-edge:#8e938a;
    --screw:#868b80;
    /* 캡이 내려앉는 배럴 안쪽 */
    --socket:#9ba196;
    --socket-deep:#767c71;

    --shadow:0 1px 2px rgba(20,24,26,.05), 0 10px 28px -18px rgba(20,24,26,.28);
    --scrim:rgba(20,24,26,.62);

    --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --pad:clamp(1.1rem,4vw,1.75rem);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0e1210;
      --surface:#161b18;
      --ink:#e9ede8;
      --ink-2:#b4bdb6;
      --muted:#7e8880;
      --line:#262d28;
      --line-soft:#1d231f;
      --accent:#9dbb5a;
      --accent-soft:#212a17;
      --danger:#e0705c;
      --danger-hi:#ea8270;
      --danger-ink:#1a0f0c;

      --cap-hi:#ff8f78;
      --cap:#d33a26;
      --cap-deep:#8b1a0f;
      --cap-ink:#fff1ed;
      --cap-wall:#7a1a0d;
      --cap-wall-2:#5e0f08;
      --cap-wall-3:#440a04;
      --plate:#2e342f;
      --plate-2:#232924;
      --plate-edge:#3f463f;
      --screw:#4c534c;
      --socket:#171c18;
      --socket-deep:#0b0f0c;

      --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -18px rgba(0,0,0,.8);
      --scrim:rgba(0,0,0,.72);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0e1210;
    --surface:#161b18;
    --ink:#e9ede8;
    --ink-2:#b4bdb6;
    --muted:#7e8880;
    --line:#262d28;
    --line-soft:#1d231f;
    --accent:#9dbb5a;
    --accent-soft:#212a17;
    --danger:#e0705c;
    --danger-hi:#ea8270;
    --danger-ink:#1a0f0c;

    --cap-hi:#ff8f78;
    --cap:#d33a26;
    --cap-deep:#8b1a0f;
    --cap-ink:#fff1ed;
    --cap-wall:#7a1a0d;
    --cap-wall-2:#5e0f08;
    --cap-wall-3:#440a04;
    --plate:#2e342f;
    --plate-2:#232924;
    --plate-edge:#3f463f;
    --screw:#4c534c;
    --socket:#171c18;
    --socket-deep:#0b0f0c;

    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -18px rgba(0,0,0,.8);
    --scrim:rgba(0,0,0,.72);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

  .wrap{
    max-width:540px;
    margin:0 auto;
    padding:clamp(2rem,7vw,3.5rem) var(--pad) clamp(3rem,10vw,5rem);
  }

  /* ---------- head ---------- */
  .mark{
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    display:flex;align-items:center;gap:.65rem;
  }
  .mark::after{content:"";flex:1;height:1px;background:var(--line)}
  h1{
    font-size:clamp(1.9rem,6.5vw,2.5rem);
    line-height:1.18;
    font-weight:700;
    letter-spacing:-.03em;
    margin:.9rem 0 .5rem;
    text-wrap:balance;
  }
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 2rem}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:1.25rem 1.25rem 1.4rem;
    margin-bottom:1.1rem;
  }
  .card-label{
    font-family:var(--mono);
    font-size:.66rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:1rem;
  }

  /* 설정 스트립 — 한 번 입력하면 끝나는 항목이라 시각적 비중을 낮춘다 */
  .setup{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:.55rem .8rem;
    padding:.7rem .85rem;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:1rem;
  }
  .pair{display:flex;align-items:center;gap:.45rem}
  .pair label{
    font-family:var(--mono);
    font-size:.66rem;
    letter-spacing:.14em;
    color:var(--muted);
  }
  .arrow{color:var(--line);font-size:.85rem;user-select:none}
  /* 좁은 화면에서는 두 줄로 떨어지므로 폭을 맞춰 오른쪽 끝을 정렬한다 */
  @media (max-width:479px){
    .arrow{display:none}
    .pair{flex:1 1 100%}
    .pair input{flex:1}
  }
  input[type="date"]{
    font-family:var(--mono);
    font-size:.8rem;
    color:var(--ink);
    background:var(--ground);
    border:1px solid var(--line);
    border-radius:5px;
    padding:.32rem .42rem;
    min-width:0;
    font-variant-numeric:tabular-nums;
  }
  input[type="date"]:focus{border-color:var(--accent)}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.75)}
  }
  :root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.75)}

  .presets{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
  .preset{
    font-family:var(--mono);
    font-size:.68rem;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:99px;
    padding:.22rem .55rem;
    cursor:pointer;
    transition:border-color .15s ease,color .15s ease,background .15s ease;
  }
  .preset:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  .error{
    display:none;
    flex-basis:100%;
    margin:0;
    font-size:.78rem;
    color:var(--danger);
  }
  .error.on{display:block}

  /* ---------- result ---------- */
  #result{display:none}
  #result.on{display:block}

  .pct-row{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.6rem}
  .pct{
    font-family:var(--mono);
    font-size:clamp(2.2rem,9vw,2.9rem);
    font-weight:600;
    letter-spacing:-.03em;
    line-height:1;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .pct small{font-size:.42em;font-weight:500;margin-left:.1em}
  .dday{
    font-family:var(--mono);
    font-size:1.05rem;
    font-weight:500;
    color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }

  .bar{
    position:relative;
    height:8px;
    background:var(--line-soft);
    border:1px solid var(--line);
    border-radius:99px;
    overflow:hidden;
  }
  /* 25 / 50 / 75% 눈금 — 계기 눈금이지 장식이 아니다 */
  .bar::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(90deg,
      transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%);
  }
  .bar-fill{
    height:100%;
    width:0;
    background:var(--accent);
    border-radius:99px;
    transition:width .7s cubic-bezier(.22,1,.36,1);
  }

  .remain{
    margin:1.1rem 0 0;
    font-size:1.45rem;
    font-weight:600;
    letter-spacing:-.02em;
  }
  .remain em{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .served{
    margin:.3rem 0 0;
    font-family:var(--mono);
    font-size:.78rem;
    letter-spacing:.02em;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- 비상정지 스위치 ---------- */
  /* padding-top 은 -1일 팝업이 떠오를 자리 */
  .console{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1rem;
    margin-top:2rem;
    padding-top:2.4rem;
  }

  .plate{
    position:relative;
    width:clamp(214px,60vw,262px);
    aspect-ratio:1;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:radial-gradient(circle at 50% 32%, var(--plate) 0%, var(--plate-2) 78%);
    border:1px solid var(--plate-edge);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -2px 6px rgba(0,0,0,.18),
      0 14px 30px -18px rgba(0,0,0,.55);
  }
  /* 캡이 내려앉는 배럴. 누르면 이 안쪽이 위로 드러나므로 어둡게 채운다 —
     여기가 밝으면 눌린 게 아니라 구멍이 뚫린 것처럼 보인다. */
  .plate::before{
    content:"";
    position:absolute;
    /* 캡(69%)보다 아주 조금만 넓게 — 눌렸을 때 드러나는 면이 반드시 이 어두운 안쪽이어야 한다.
       캡이 더 넓으면 밝은 플레이트가 드러나서 다시 구멍처럼 보인다. */
    inset:14%;
    border-radius:50%;
    background:radial-gradient(circle at 50% 12%, var(--socket-deep) 0%, var(--socket) 72%);
    box-shadow:
      inset 0 9px 14px rgba(0,0,0,.55),
      inset 0 -3px 6px rgba(255,255,255,.07),
      0 1px 0 rgba(255,255,255,.28);
  }
  .screw{
    position:absolute;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--screw);
    box-shadow:inset 0 1px 1px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.25);
  }
  .screw.n{top:6%;left:50%;transform:translateX(-50%)}
  .screw.s{bottom:6%;left:50%;transform:translateX(-50%)}
  .screw.w{left:6%;top:50%;transform:translateY(-50%)}
  .screw.e{right:6%;top:50%;transform:translateY(-50%)}

  #deleteBtn{
    position:relative;
    z-index:1;
    width:69%;
    aspect-ratio:1;
    padding:0;
    border:0;
    border-radius:50%;
    cursor:pointer;
    font-family:var(--sans);
    font-size:clamp(1.1rem,4.2vw,1.35rem);
    font-weight:700;
    letter-spacing:.03em;
    color:var(--cap-ink);
    background:radial-gradient(circle at 38% 27%, var(--cap-hi) 0%, var(--cap) 46%, var(--cap-deep) 100%);
    text-shadow:0 1px 2px rgba(0,0,0,.42);
    /* 원통 높이만큼 아래 마진을 줘야 원 안에서 광학적으로 중앙에 온다.
       transform 이 아니라 마진으로 잡아야 눌림 애니메이션과 값이 얽히지 않는다. */
    margin-bottom:22px;
    /* 4단으로 쌓은 측면 — 아래로 갈수록 어두워져 원통으로 읽힌다.
       눌림 상태와 레이어 수·순서가 같아야 box-shadow 가 보간된다. */
    box-shadow:
      0 4px 0 var(--cap-wall),
      0 9px 0 var(--cap-wall-2),
      0 13px 0 var(--cap-wall-2),
      0 18px 0 var(--cap-wall-3),
      0 4px 14px 2px rgba(0,0,0,.28),      /* 머리 밑 접촉 그림자 — 회색 위로 번져 떠 있는 게 보인다 */
      0 24px 18px -8px rgba(0,0,0,.42),
      inset 0 -9px 15px rgba(0,0,0,.34),
      inset 0 6px 11px rgba(255,255,255,.28);
    transition:transform .12s ease, box-shadow .12s ease;   /* 놓을 때 — 천천히 올라온다 */
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }
  #deleteBtn:active,
  #deleteBtn.punch{
    /* 12px 내려가고 벽은 18 → 6px. 합이 그대로 18 이라 원통 밑면은 제자리에 고정되고,
       전체가 미끄러지는 대신 위에서 눌려 들어가는 것으로 읽힌다. */
    transform:translateY(12px);
    box-shadow:
      0 2px 0 var(--cap-wall),
      0 3px 0 var(--cap-wall-2),
      0 4px 0 var(--cap-wall-2),
      0 6px 0 var(--cap-wall-3),
      0 2px 7px 0 rgba(0,0,0,.36),         /* 내려앉으면 접촉 그림자가 좁고 진해진다 */
      0 10px 12px -8px rgba(0,0,0,.4),
      inset 0 -5px 11px rgba(0,0,0,.42),
      inset 0 3px 9px rgba(255,255,255,.14);
    transition:transform .05s ease, box-shadow .05s ease;   /* 누를 때 — 빠르게 들어간다 */
  }

  .ripple{
    position:absolute;
    left:50%;top:50%;
    width:100%;
    aspect-ratio:1;
    border-radius:50%;
    border:1px solid var(--cap);
    transform:translate(-50%,-50%) scale(1);
    opacity:.45;
    pointer-events:none;
    animation:ring .55s ease-out forwards;
  }
  @keyframes ring{
    to{transform:translate(-50%,-50%) scale(1.32);opacity:0}
  }

  /* 자동으로 버튼을 눌러주는 대원들. 디자인 전이라 일단 정사각형. */
  .crew{
    display:grid;
    grid-template-columns:repeat(2,42px);
    gap:6px;
    justify-content:center;
    margin-top:.9rem;
  }
  .crew:empty{display:none}
  /* 플레이트 옆에 자리가 나오는 폭부터는 버튼 오른쪽에 세운다 */
  @media (min-width:560px){
    .crew{
      position:absolute;
      right:0;
      top:50%;
      transform:translateY(-50%);
      margin:0;
    }
  }
  .crew-unit{
    width:42px;height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:.62rem;
    color:var(--ink-2);
    background:var(--surface);
    border:1px solid var(--line);
    transition:background .12s ease,border-color .12s ease,transform .12s ease,color .12s ease;
  }
  .crew-unit.tick{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--danger-ink);
    transform:scale(1.12);
  }

  /* 배수 아이템을 쓰고 있을 때 지갑에 붙는 표시 */
  .mult-badge{
    display:inline-block;
    margin-left:.4rem;
    padding:.1rem .4rem;
    font-family:var(--mono);
    font-size:.62rem;
    font-weight:600;
    color:var(--danger-ink);
    background:var(--accent);
    border-radius:99px;
    vertical-align:middle;
  }

  /* 누르라고 만든 버튼에 붙는 경고 */
  .warn{
    margin:0;
    font-family:var(--mono);
    font-size:.7rem;
    letter-spacing:.34em;
    text-indent:.34em;
    color:var(--muted);
  }

  .pop{
    position:absolute;
    pointer-events:none;
    font-family:var(--mono);
    font-size:.85rem;
    font-weight:600;
    color:var(--accent);
    animation:rise .75s ease-out forwards;
    will-change:transform,opacity;
  }
  @keyframes rise{

  /* ---------- 광고 ---------- */
  /* 3단 배치. 본문 폭(540px)은 건드리지 않고 좌우에 레일만 덧붙인다. */
  .shell{
    display:flex;
    justify-content:center;
    align-items:flex-start;      /* 레일이 세로로 늘어나면 sticky 가 죽는다 */

  .rail{display:none}

  @media (min-width:960px){

      display:block;

  .ad-tag{

  /* 하단 고정 배너 — 모바일에만 */
  .anchor{

    left:0;right:0;bottom:0;

  .anchor.closed{display:none}
  /* 고정 배너가 푸터를 가리지 않도록 그만큼 비워둔다 */
  @media (max-width:959px){body{padding-bottom:132px}}
  body.ad-closed{padding-bottom:0}
  .anchor .adslot{height:100px;width:320px;max-width:100%}
  .anchor-close{
    position:absolute;
    top:-13px;right:.5rem;
    width:26px;height:26px;
    line-height:1;
    font-size:1rem;
    color:var(--muted);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:50%;
    cursor:pointer;

  .anchor-close:hover{color:var(--ink)}

  @media (pointer: coarse){
    input[type="date"],
    .shop-search{ font-size:16px }
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }

    var y = +p[0], m = +p[1], d = +p[2];
    if (!y || !m || !d) return null;
    var dt = new Date(y, m - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
    return dt;
  }

  function toISO(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }

  // 서머타임/타임존으로 어긋난 소수점을 반올림으로 흡수한다.
  function dayDiff(a, b) { return Math.round((b - a) / 86400000); }

  // 월말 보정 포함 (1/31 + 1개월 = 2/28)
  function addMonths(d, n) {
    var y = d.getFullYear(), m = d.getMonth() + n, day = d.getDate();
    var last = new Date(y, m + 1, 0).getDate();
    return new Date(y, m, Math.min(day, last));
  }

  function midnightToday() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  // 남은 기간을 달력 기준 개월 + 일로 쪼갠다. (남은일/30 은 실제 달력과 어긋난다)
  function splitMonths(from, to) {
    var months = 0;
    while (addMonths(from, months + 1) <= to) months++;
    return { months: months, days: dayDiff(addMonths(from, months), to) };
  }

  function calcService(startISO, endISO, today) {
    var s = parseISO(startISO), e = parseISO(endISO);
    if (!s || !e) return { state: 'empty' };
    if (e <= s) return { state: 'invalid' };

    var total = dayDiff(s, e);
    var served = dayDiff(s, today);

    if (served < 0) return { state: 'before', total: total, dday: -served };
    if (served >= total) return { state: 'done', total: total, served: total, progress: 1 };

    var rest = splitMonths(today, e);
    return {
      state: 'active',
      total: total,
      served: served,
      progress: served / total,
      dday: total - served,
      months: rest.months,
      days: rest.days
    };
  }

  /* ══════════════════════════════════════════
     렌더링
     ══════════════════════════════════════════ */
  function setError(msg) {
    errEl.textContent = msg || '';
    errEl.className = msg ? 'error on' : 'error';
  }

  function render() {
    var r = calcService(startEl.value, endEl.value, midnightToday());

    if (r.state === 'empty') { setError(''); resultEl.className = 'card'; return; }
    if (r.state === 'invalid') {
      setError('전역일이 입대일보다 뒤여야 합니다.');
      resultEl.className = 'card';
      return;
    }
    setError('');
    resultEl.className = 'card on';

    if (r.state === 'before') {
      pctNum.textContent = '0';
      barFill.style.width = '0%';
      barEl.setAttribute('aria-valuenow', '0');
      ddayEl.textContent = 'D-' + r.dday;
      remainEl.innerHTML = '아직 입대 전 · <em>' + r.dday + '</em>일 남음';
      servedEl.textContent = '총 복무 예정 ' + r.total + '일';
      return;
    }

    if (r.state === 'done') {
      pctNum.textContent = '100';
      barFill.style.width = '100%';
      barEl.setAttribute('aria-valuenow', '100');
      ddayEl.textContent = '전역';
      remainEl.textContent = '전역했습니다. 축하합니다.';
      servedEl.textContent = '복무 ' + r.total + ' / ' + r.total + '일';
      return;
    }

    var pct = Math.floor(r.progress * 1000) / 10;   // 소수 첫째 자리, 반올림 없이
    pctNum.textContent = pct.toFixed(1);
    barFill.style.width = (r.progress * 100) + '%';
    barEl.setAttribute('aria-valuenow', String(Math.round(r.progress * 100)));
    ddayEl.textContent = 'D-' + r.dday;

    // 딱 떨어지는 달이면 "15개월 0일" 대신 "15개월"
    var parts = [];
    if (r.months > 0) parts.push('<em>' + r.months + '</em>개월');
    if (r.days > 0 || r.months === 0) parts.push('<em>' + r.days + '</em>일');
    remainEl.innerHTML = parts.join(' ') + ' 남음';
    servedEl.textContent = '복무 ' + r.served + ' / ' + r.total + '일';
  }

  /* ══════════════════════════════════════════
     사운드 (Web Audio 합성 · 외부 파일 없음)
     ══════════════════════════════════════════ */
  var ctx = null, noiseBuf = null, voices = [], comboIdx = 0, lastClick = 0;
  var muted = load(LS.muted) === '1';

  // C 메이저 펜타토닉을 두 옥타브 반 쌓아 올린 사다리
  var SCALE = [261.63, 293.66, 329.63, 392.00, 440.00,
               523.25, 587.33, 659.25, 783.99, 880.00,
               1046.50, 1174.66, 1318.51];

  function audio() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    // 화이트노이즈는 한 번만 만들어 재사용
    var len = Math.floor(ctx.sampleRate * 0.2);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var ch = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    return ctx;
  }

  // 연타해도 노드가 쌓이지 않도록 상한을 두고 끝난 노드는 즉시 끊는다.
  function track(node) {
    voices.push(node);
    if (voices.length > MAX_VOICES) {
      var old = voices.shift();
      try { old.stop(); } catch (e) {}
    }
    node.onended = function () {
      try { node.disconnect(); } catch (e) {}
      var i = voices.indexOf(node);
      if (i > -1) voices.splice(i, 1);
    };
  }

  // 타격감: 짧은 노이즈 버스트를 밴드패스로 깎는다
  function thud(t, gain) {
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 2000; bp.Q.value = 0.9;
    var g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t + 0.05);
    track(src);
  }

  // 음정: 삼각파 + 지수 감쇠
  function tone(t, freq, gain, dur) {
    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
    track(osc);
  }

  function playClick(count) {
    if (muted) return;
    var c = audio();
    if (!c) return;
    if (c.state === 'suspended') c.resume();

    var now = c.currentTime;
    var wall = Date.now();
    if (wall - lastClick > COMBO_RESET_MS) comboIdx = 0;
    else comboIdx = Math.min(comboIdx + 1, SCALE.length - 1);
    lastClick = wall;

    thud(now, 0.22);
    tone(now, SCALE[comboIdx], 0.2, 0.18);

    // 10회 배수마다 아르페지오 보상
    if (count % 10 === 0) {
      var base = Math.min(comboIdx, SCALE.length - 5);
      tone(now + 0.02, SCALE[base + 2], 0.16, 0.3);
      tone(now + 0.04, SCALE[base + 4], 0.14, 0.36);
    }
  }

  function syncSoundBtn() {
    soundBtn.textContent = muted ? '🔇 소리 끔' : '🔊 소리 켬';
    soundBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
  }

  /* ══════════════════════════════════════════
     광고 — AdSense 디스플레이 배너 (좌우 레일 + 모바일 하단)
     ══════════════════════════════════════════ */

  // 폭이 0이거나 display:none 인 컨테이너에 push 하면 광고가 채워지지 않고
  // 콘솔에 availableWidth=0 오류만 남는다. 지금 실제로 보이는 단위에만 push 한다.
  // 같은 <ins> 에 두 번 push 할 수 없으므로 리사이즈 대응은 하지 않는다.
  function initAds() {
    // 보상형 광고(H5 Games Ads)는 SDK 가 있을 때만 설정한다.
    // 디스플레이 광고와 로더가 같아서 별도 스크립트는 필요 없다.
    if (typeof window.adConfig === 'function') {
      try {
        window.adConfig({ preloadAdBreaks: 'on', sound: 'on' });
      } catch (e) { /* 설정 실패해도 디스플레이 광고는 그대로 간다 */ }
    }

    // 로더가 async 라 이 시점에 window.adsbygoogle 이 없는 건 정상이다.
    // 배열에 push 해두면 SDK 가 도착해서 처리한다 — 이걸 "SDK 없음" 으로
    // 판정하면 광고가 영영 뜨지 않는다. 스크립트 태그 유무로만 가른다.
    if (!document.querySelector('script[src*="adsbygoogle.js"]')) {
      [$('adLeft'), $('adRight'), $('adAnchor')].forEach(showAdPlaceholder);
      return;
    }

    var wide = window.matchMedia('(min-width:960px)').matches;
    var units = wide ? [$('adLeft'), $('adRight')] : [$('adAnchor')];

    // push({}) 는 "문서 순서상 아직 안 채운 첫 <ins>" 를 채운다. 지금 안 쓰는
    // 자리를 남겨두면 모바일에서 그 한 번이 숨겨진 좌측 레일로 가버리고
    // (폭 0 오류) 하단 배너는 끝내 비어 있는다. 미리 걷어낸다.
    [$('adLeft'), $('adRight'), $('adAnchor')].forEach(function (ins) {
      if (ins && units.indexOf(ins) === -1 && ins.parentNode) ins.parentNode.removeChild(ins);
    });

    units.forEach(function (ins) {
      if (!ins) return;
      try {
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      } catch (e) {
        showAdPlaceholder(ins);
      }
    });

    // 광고차단기 · 미승인 도메인 · 재고 없음 — 어느 쪽이든 칸이 안 채워진다.
    // 빈 자리를 그냥 두면 레이아웃이 뚫린 것처럼 보이므로 점선 상자로 되돌린다.
    setTimeout(function () {
      units.forEach(function (ins) {
        // <ins> 는 CSS 로 높이가 잡혀 있어 offsetHeight 로는 판별이 안 된다.
        // 채워졌는지는 SDK 가 남기는 data-ad-status 로 본다.
        if (ins && ins.parentNode &&
            (ins.getAttribute('data-ad-status') === 'unfilled' || !ins.querySelector('iframe'))) {
          showAdPlaceholder(ins);
        }
      });
    }, 3000);
  }

  // <ins> 를 같은 크기의 점선 상자로 바꿔 배치를 눈으로 확인할 수 있게 한다
  function showAdPlaceholder(ins) {
    if (!ins || !ins.parentNode) return;
    var box = document.createElement('div');
    box.className = 'adslot';
    box.textContent = '광고 자리';
    box.style.width = ins.style.width;
    box.style.height = ins.style.height;
    ins.parentNode.replaceChild(box, ins);
  }

  anchorClose.addEventListener('click', function () {
    anchor.classList.add('closed');
    document.body.classList.add('ad-closed');   // 배너 자리로 비워둔 여백도 같이 회수
  });

  /* ══════════════════════════════════════════
     클릭
     ══════════════════════════════════════════ */
  function readInt(key) {
    var n = parseInt(load(key) || '0', 10);
    return (isFinite(n) && n > 0) ? n : 0;
  }

  // 지갑 도입 전에는 클릭 수가 ad.count 하나에만 있었다. 그 값을 누적으로 넘긴다.
  var total = readInt(LS.total) || readInt(LS.legacy);
  var spent = readInt(LS.spent);
  var owned = [];
  try {
    var raw = JSON.parse(load(LS.owned) || '[]');
    if (Object.prototype.toString.call(raw) === '[object Array]') owned = raw;
  } catch (e) {}

  function balance() { return Math.max(0, total - spent); }

  function renderWallet() {
    balanceNum.textContent = balance().toLocaleString('ko-KR');
    totalNum.textContent = total.toLocaleString('ko-KR');
    shopBalance.textContent = balance().toLocaleString('ko-KR');
    var m = multiplier();
    multBadge.hidden = m <= 1;
    multBadge.textContent = '×' + m;
  }

  // 한 번 누를 때 올라가는 일수. 자동 클릭에도 똑같이 적용된다.
  function addDays(n) {
    total += n;
    store(LS.total, String(total));
    renderWallet();
    refreshShopSoon();
  }

  var punchTimer = null;
  function punch() {
    btn.classList.add('punch');
    clearTimeout(punchTimer);
    punchTimer = setTimeout(function () { btn.classList.remove('punch'); }, 90);
  }

  // 캡에서 퍼져 나가는 링. 연타해도 항상 하나만 — 겹치면 산만하고 노드도 쌓인다.
  function ripple() {
    var old = plate.querySelector('.ripple');
    if (old) plate.removeChild(old);
    var el = document.createElement('span');
    el.className = 'ripple';
    plate.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 600);
  }

  function pop() {
    // 연타 시 상한. 화면에 8개 넘게 떠 있으면 읽히지도 않는다.
    var live = stage.querySelectorAll('.pop');
    if (live.length >= 8) stage.removeChild(live[0]);
    var el = document.createElement('span');
    el.className = 'pop';
    el.textContent = '-' + multiplier() + '일';
    el.style.left = (25 + Math.random() * 50) + '%';
    el.style.top = (0.8 + Math.random() * 0.9) + 'rem';
    stage.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 800);
  }

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  btn.addEventListener('click', function () {
    addDays(multiplier());

    playClick(total);
    punch();                              // 눌림은 장식이 아니라 버튼의 기본 피드백
    if (!reduced) { pop(); ripple(); }
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
  });

  /* ══════════════════════════════════════════
     상점
     ══════════════════════════════════════════ */
  var items = null;          // null = 아직 안 불러옴
  var itemsError = '';
  var lastFocus = null;

  /* ── 아이템 효과 ──
     multiplier: 한 번 누를 때 올라가는 일수 배수. 겹치지 않고 가장 높은 것만 적용된다.
     auto:       제 주기마다 알아서 버튼을 눌러주는 대원. 산 만큼 늘어난다. */

  function ownedItems() {
    if (!items) return [];
    return items.filter(function (it) { return owned.indexOf(it.id) > -1; });
  }

  // 공유로 켠 한시적 배수. 남은 시간(ms) — 0 이면 꺼진 것.
  function boostLeft() {
    var until = parseInt(load(LS.boost) || '0', 10);
    return (isFinite(until) && until > Date.now()) ? until - Date.now() : 0;
  }

  function shareItem() {
    return (items || []).filter(function (it) {
      return it.effect && it.effect.type === 'share';
    })[0];
  }

  function multiplier() {
    var boosted = boostLeft() > 0 && shareItem();
    var m = boosted ? boosted.effect.value : 1;
    ownedItems().forEach(function (it) {
      if (it.effect && it.effect.type === 'multiplier') m = Math.max(m, it.effect.value);
    });
    return m;
  }

  var autoTimers = [];
  var lastAutoPunch = 0;

  function autoTick(item) {
    addDays(multiplier());
    flashCrew(item.id);
    // 상사까지 다 사면 초당 14번이다. 그대로 punch 하면 눌린 채로 멈춘 것처럼 보인다.
    var now = Date.now();
    if (now - lastAutoPunch > 130) { lastAutoPunch = now; punch(); }
  }

  function applyEffects() {
    autoTimers.forEach(clearInterval);
    autoTimers = [];

    var autos = ownedItems().filter(function (it) {
      return it.effect && it.effect.type === 'auto' && it.effect.intervalMs > 0;
    });

    autos.forEach(function (it) {
      autoTimers.push(setInterval(function () { autoTick(it); }, it.effect.intervalMs));
    });

    crew.innerHTML = autos.map(function (it) {
      return '<div class="crew-unit" data-id="' + esc(it.id) + '" title="' + esc(it.name) + '">' +
             esc(it.name) + '</div>';
    }).join('');

    renderWallet();
    renderReward();          // 보상 설정도 items.json 에서 같이 오므로 여기서 갱신
  }

  function flashCrew(id) {
    var el = crew.querySelector('[data-id="' + id + '"]');
    if (!el) return;
    el.classList.add('tick');
    setTimeout(function () { el.classList.remove('tick'); }, 160);
  }

  /* ══════════════════════════════════════════
     보상형 광고 (H5 Games Ads)
     ══════════════════════════════════════════ */
  var rewardCfg = null;          // items.json 의 reward 설정
  var rewardInFlight = false;
  var rewardTimer = null;        // 쿨다운 카운트다운

  function cooldownLeft() {
    if (!rewardCfg) return 0;
    var at = parseInt(load(LS.rewardAt) || '0', 10);
    if (!isFinite(at) || at <= 0) return 0;
    var left = Math.ceil((at + rewardCfg.cooldownSec * 1000 - Date.now()) / 1000);
    return left > 0 ? left : 0;
  }

  function mmss(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  // 버튼 상태는 항상 여기서만 정한다. note 를 넘기면 안내 문구도 같이 바꾼다.
  function renderReward(note) {
    clearInterval(rewardTimer);
    if (!rewardCfg) { rewardRow.hidden = true; return; }

    rewardRow.hidden = false;
    rewardTitle.textContent = '광고 보고 ' + rewardCfg.days.toLocaleString('ko-KR') + '일 받기';
    if (note) rewardNote.textContent = note;

    var left = cooldownLeft();
    if (left > 0) {
      rewardBtn.disabled = true;
      rewardBtn.textContent = mmss(left) + ' 후';
      if (!note) rewardNote.textContent = '조금 뒤에 다시 받을 수 있습니다.';
      rewardTimer = setInterval(function () {
        var n = cooldownLeft();
        if (n <= 0) { renderReward('끝까지 보면 지급됩니다.'); return; }
        rewardBtn.textContent = mmss(n) + ' 후';
      }, 1000);
      return;
    }

    rewardBtn.disabled = rewardInFlight;
    rewardBtn.textContent = rewardInFlight ? '불러오는 중…' : '보기';
    if (!note) rewardNote.textContent = '끝까지 보면 지급됩니다.';
  }

  // 광고가 뜬 동안 앱을 멈춘다. 뒤에서 잔액이 오르면 보상 체감이 사라지고
  // 소리가 광고와 겹친다.
  function pauseForAd() {
    if (ctx && ctx.state === 'running') ctx.suspend();
    autoTimers.forEach(clearInterval);
    autoTimers = [];
  }
  function resumeAfterAd() {
    if (ctx && ctx.state === 'suspended' && !muted) ctx.resume();
    applyEffects();          // 타이머를 원래대로 재구성 (idempotent)
  }

  function grantReward() {
    addDays(rewardCfg.days);           // 배수를 곱하지 않는다 — 보상은 고정액
    store(LS.rewardAt, String(Date.now()));
    renderReward('+' + rewardCfg.days.toLocaleString('ko-KR') + '일 받았습니다.');
  }

  function watchRewardAd() {
    if (!rewardCfg || rewardInFlight || cooldownLeft() > 0) return;
    rewardInFlight = true;
    renderReward('광고를 불러오는 중…');

    // 개발용 모달은 로컬에서만 쓴다. adBreak 별칭은 항상 정의되어 있어서
    // SDK 유무로 가를 수 없고, 배포본에서 이 경로를 타면 광고 없이 일수가
    // 나가버린다.
    if (isDevHost() || typeof window.adBreak !== 'function') {
      pauseForAd();
      showDevRewardAd(function (completed) {
        resumeAfterAd();
        rewardInFlight = false;
        if (completed) grantReward();
        else renderReward('끝까지 봐야 받을 수 있습니다.');
      });
      return;
    }

    var offered = false, settled = false;
    // 광고차단기가 로더를 막으면 큐를 아무도 비우지 않아 콜백이 영영 안 온다.
    // 버튼이 "불러오는 중…" 에 멎지 않도록 풀어준다. 보상은 주지 않는다.
    var giveUp = setTimeout(function () {
      if (settled) return;
      settled = true;
      rewardInFlight = false;
      resumeAfterAd();
      renderReward('지금은 볼 수 있는 광고가 없습니다.');
    }, 12000);

    window.adBreak({
      type: 'reward',
      name: 'shop-reward',
      beforeReward: function (showAdFn) { offered = true; showAdFn(); },
      beforeAd: pauseForAd,
      afterAd: resumeAfterAd,
      adViewed: grantReward,                                   // 보상은 오직 여기서만
      adDismissed: function () { renderReward('끝까지 봐야 받을 수 있습니다.'); },
      adBreakDone: function (info) {
        // beforeReward 가 아예 안 불렸으면 지금 줄 광고가 없다는 뜻이다.
        clearTimeout(giveUp);
        if (settled) return;
        settled = true;
        rewardInFlight = false;
        if (!offered) renderReward('지금은 볼 수 있는 광고가 없습니다.');
        else renderReward();
        if (window.console && console.debug) {
          console.debug('[ad] reward breakStatus =', info && info.breakStatus);
        }
      }
    });
  }

  function isDevHost() {
    return location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  }

  // 개발용 — 실제 광고 대신 5초짜리 가짜 광고. 중간에 닫으면 미지급.
  function showDevRewardAd(done) {
    var left = 5, timer = null, finished = false;
    adTitle.textContent = '보상형 광고 · 개발용';
    adSlotBox.textContent = '광고 재생 중…';
    adScrim.className = 'scrim on';
    adClose.disabled = false;
    adClose.textContent = '건너뛰기';

    timer = setInterval(function () {
      left--;
      adSlotBox.textContent = left > 0 ? '광고 재생 중… ' + left : '시청 완료';
      if (left <= 0) {
        clearInterval(timer);
        finished = true;
        adClose.textContent = '닫고 보상 받기';
      }
    }, 1000);

    adClose.onclick = function () {
      clearInterval(timer);
      adScrim.className = 'scrim';
      done(finished);
    };
  }

  rewardBtn.addEventListener('click', watchRewardAd);

  // 아이템 정의는 items.json 한 곳에만 둔다. 아티팩트처럼 파일을 같이 올릴 수
  // 없는 환경을 위해, 페이지 안에 인라인 사본이 있으면 그쪽을 먼저 쓴다.
  function loadItems() {
    // 아이템과 보상 설정을 같은 파일에서 함께 읽는다
    function take(data) {
      items = data.items || [];
      if (data.reward && data.reward.days > 0) rewardCfg = data.reward;
    }

    var inline = document.getElementById('shopItemsInline');
    if (inline) {
      try {
        take(JSON.parse(inline.textContent));
        return Promise.resolve();
      } catch (e) {
        itemsError = '아이템 목록을 읽을 수 없습니다.';
        return Promise.resolve();
      }
    }
    return fetch('items.json')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(take)
      .catch(function () {
        // file:// 로 열면 브라우저가 로컬 fetch 를 막는다. 배포본에서는 정상.
        itemsError = location.protocol === 'file:'
          ? '파일을 직접 열면 아이템 목록을 불러올 수 없습니다. 배포된 주소에서 확인해 주세요.'
          : 'items.json 을 불러오지 못했습니다.';
      });
  }

  function itemMatches(item, q) {
    if (!q) return true;
    return (item.name + ' ' + (item.description || '') + ' ' + (item.category || ''))
      .toLowerCase().indexOf(q) > -1;
  }

  function renderShop() {
    if (itemsError) { shopBody.innerHTML = '<p class="shop-msg">' + itemsError + '</p>'; return; }
    if (items === null) { shopBody.innerHTML = '<p class="shop-msg">불러오는 중…</p>'; return; }

    var q = shopSearch.value.trim().toLowerCase();
    var list = items.filter(function (it) { return itemMatches(it, q); });

    if (!list.length) {
      shopBody.innerHTML = '<p class="shop-msg">' +
        (q ? '"' + esc(q) + '" 에 맞는 아이템이 없습니다.' : '아이템이 없습니다.') + '</p>';
      return;
    }

    var bal = balance();
    shopBody.innerHTML = list.map(function (it) {
      var isShare = it.effect && it.effect.type === 'share';
      var left = isShare ? boostLeft() : 0;
      var has = !isShare && owned.indexOf(it.id) > -1;
      var short = !isShare && !has && bal < it.price;
      var label = isShare
        ? (left > 0 ? mmss(Math.ceil(left / 1000)) + ' 남음' : '공유하기')
        : (has ? '보유 중' : (short ? '부족' : '구매'));
      return '<article class="item' + (has || left > 0 ? ' owned' : '') + (short ? ' short' : '') + '">' +
        '<div class="item-icon" aria-hidden="true">' + esc(it.icon || '📦') + '</div>' +
        '<div>' +
          '<div class="item-cat">' + esc(it.category || '') + '</div>' +
          '<h3 class="item-name">' + esc(it.name) + '</h3>' +
          '<p class="item-desc">' + esc(it.description || '') + '</p>' +
        '</div>' +
        '<div class="item-buy">' +
          '<div class="item-price">' +
            (isShare ? '무료' : it.price.toLocaleString('ko-KR') + '일') + '</div>' +
          '<button class="buy-btn" type="button" data-id="' + esc(it.id) + '"' +
            (has || short || left > 0 ? ' disabled' : '') + '>' + label + '</button>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  // 자동 클릭이 초당 여러 번 돌아가므로 그때마다 카드를 다시 그리면 낭비다.
  // 잔액 숫자는 renderWallet 이 즉시 갱신하고, 카드는 여기서 묶어서 갱신한다.
  var shopRefreshQueued = false;
  function refreshShopSoon() {
    if (shopRefreshQueued || !shopScrim.classList.contains('on')) return;
    shopRefreshQueued = true;
    setTimeout(function () { shopRefreshQueued = false; renderShop(); }, 400);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function buy(id) {
    var item = items && items.filter(function (it) { return it.id === id; })[0];
    if (!item) return;
    if (item.effect && item.effect.type === 'share') { shareLink(item); return; }
    if (owned.indexOf(id) > -1) return;      // 이미 보유
    if (balance() < item.price) return;      // 잔액 부족 — 버튼도 비활성이지만 한 번 더 막는다

    spent += item.price;
    owned.push(id);
    store(LS.spent, String(spent));
    store(LS.owned, JSON.stringify(owned));
    applyEffects();          // 산 즉시 배수·자동 대원이 붙는다
    renderShop();
  }

  shopBody.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.buy-btn');
    if (b && !b.disabled) buy(b.getAttribute('data-id'));
  });

  // 공유 여부는 어차피 확인할 수 없다. 공유창을 띄웠거나 링크를 복사했으면 준다.
  function shareLink(item) {
    var url = location.href;
    function grant() {
      store(LS.boost, String(Date.now() + item.effect.durationMs));
      renderWallet();
      renderShop();
      watchBoost();
    }
    function copy() {
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(grant, grant);
      else grant();
    }
    // 공유창을 닫았거나 iframe 이 막으면 복사로 넘어간다
    if (navigator.share) navigator.share({ title: document.title, url: url }).then(grant, copy);
    else copy();
  }

  // 남은 시간 카운트다운. 부스트가 켜져 있는 동안에만 돈다 — 상시 타이머로 두면
  // 아무 일 없을 때도 카드를 계속 갈아치운다.
  // ponytail: 카드 전체를 다시 그린다. 10여 개라 문제없고, 수백 개로 늘면
  //           버튼 하나만 갱신하도록 바꿀 것.
  var boostTimer = null;
  function watchBoost() {
    clearInterval(boostTimer);
    if (boostLeft() <= 0) return;
    boostTimer = setInterval(function () {
      var over = boostLeft() <= 0;
      if (over) { clearInterval(boostTimer); renderWallet(); }   // 배지도 ×1 로 돌린다
      if (shopScrim.classList.contains('on')) renderShop();
    }, 1000);
  }

  shopSearch.addEventListener('input', renderShop);

  function openShop() {
    lastFocus = document.activeElement;
    shopScrim.classList.add('on');
    if (items === null) {
      itemsError = '';                    // 지난 실패는 붙잡아두지 않는다 — 열 때마다 다시 시도
      renderShop();                       // "불러오는 중…"
      loadItems().then(function () { applyEffects(); renderShop(); });
    } else {
      renderShop();
    }
    // 터치 기기에서 검색창에 바로 포커스를 주면 키보드가 튀어 올라오고
    // 상점이 키보드에 가린다. 포커스는 대화상자 안에 두되(Esc·스크린리더용)
    // 검색은 사용자가 직접 누를 때만 열리게 한다.
    if (window.matchMedia('(pointer: coarse)').matches) shopClose.focus();
    else shopSearch.focus();
  }

  function closeShop() {
    shopScrim.classList.remove('on');
    // 상점 안에 있던 요소로는 돌려보내지 않는다 — 이제 화면에 없다
    var back = (lastFocus && lastFocus.focus && !shopScrim.contains(lastFocus)) ? lastFocus : shopOpen;
    back.focus();
  }

  shopOpen.addEventListener('click', openShop);
  shopClose.addEventListener('click', closeShop);
  shopScrim.addEventListener('click', function (e) {
    if (e.target === shopScrim) closeShop();      // 바깥 클릭으로 닫기
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && shopScrim.classList.contains('on')) closeShop();
  });

  soundBtn.addEventListener('click', function () {
    muted = !muted;
    store(LS.muted, muted ? '1' : '0');
    syncSoundBtn();
    if (!muted) { var c = audio(); if (c && c.state === 'suspended') c.resume(); }
  });

  /* ══════════════════════════════════════════
     입력 처리
     ══════════════════════════════════════════ */
  startEl.addEventListener('change', function () { store(LS.start, startEl.value); render(); });
  endEl.addEventListener('change', function () { store(LS.end, endEl.value); render(); });

  Array.prototype.forEach.call(document.querySelectorAll('.preset'), function (p) {
    p.addEventListener('click', function () {
      var s = parseISO(startEl.value);
      if (!s) { setError('먼저 입대일을 입력해 주세요.'); return; }
      // 만기 전역일 = 입대일 + n개월 - 1일
      var months = parseInt(p.getAttribute('data-months'), 10);
      var e = addMonths(s, months);
      e.setDate(e.getDate() - 1);
      endEl.value = toISO(e);
      store(LS.end, endEl.value);
      render();
    });
  });

  // 복원
  var sv = load(LS.start), ev = load(LS.end);
  if (sv) startEl.value = sv;
  if (ev) endEl.value = ev;
  renderWallet();
  syncSoundBtn();
  render();
  initAds();
  // 상점을 열지 않아도 자동 대원이 일해야 하므로 아이템은 시작할 때 읽는다
  loadItems().then(applyEffects);
  watchBoost();

  // 콘솔 검증용
  window.__army = {
    calcService: calcService, parseISO: parseISO,
    addMonths: addMonths, splitMonths: splitMonths
  };
})();
</script>
</body>
</html>
